# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Deploy em um clique: https://render.com/deploy?repo=https://github.com/netomondo-prog/Site
services:
  - type: web
    name: jtec-site
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # E-mail do formulário de contato (opcional). Preencha no painel do Render.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        value: contato@jtec.com.br
    # Para manter as edições do painel entre deploys é preciso um disco
    # persistente (plano pago). Descomente as linhas abaixo e defina DATA_DIR.
    # disk:
    #   name: jtec-data
    #   mountPath: /data
    #   sizeGB: 1
    # envVars:
    #   - key: DATA_DIR
    #     value: /data
